version: "3.9"
services:
  tgth-web-service:
    build:
      context: ../../
      dockerfile: ./docker/Dockerfile
    image: ${CONTAINER_NAME}:latest
    restart: always
    volumes:
      - ../../:/app
      - /app/node_modules
    env_file:
      - ../../.env
    command: yarn start
    ports:
      - ${EXTERNAL_PORT}:${PORT}
    networks:
      tgth-web-service-network:

networks:
  tgth-web-service-network:
